[project]
name = "cosmos3-nim-examples"
version = "0.1.0"
description = "Client environment for the Cosmos3 Certified NIM examples"
requires-python = ">=3.10"
dependencies = [
  "openai==2.53.0",
  "pillow==12.1.0",
  "pyyaml==6.0.3",
  "requests==2.34.2",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "ruff==0.16.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["examples", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Match the existing notebook workflow's strictness: syntax/runtime-level only,
# not full style on legacy example scripts.
select = ["E9", "F63", "F7", "F82"]

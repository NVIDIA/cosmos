name: Cosmos3 NIM docs

on:
  pull_request:
    paths:
      - "cookbooks/cosmos3/nim/**"
      - ".github/workflows/cosmos3-nim-docs.yml"
  push:
    paths:
      - "cookbooks/cosmos3/nim/**"
      - ".github/workflows/cosmos3-nim-docs.yml"

permissions:
  contents: read

jobs:
  check-code-fences:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check runnable documentation blocks
        run: python3 cookbooks/cosmos3/nim/maintainer/check_code_fences.py
